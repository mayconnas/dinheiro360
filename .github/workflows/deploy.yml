# ─────────────────────────────────────────────────────────────
# Deploy — build → (migrations) → deploy no Swarm da VPS → health check.
#
# Dispara com:
#   • push de tag v*            (ex.: git tag v1.2.3 && git push origin v1.2.3)
#   • execução manual           (Actions → Deploy → Run workflow), com a
#                               opção de rodar as migrations antes do deploy
#
# Imagem publicada em ghcr.io/<owner>/<repo> com as tags `latest`, o sha
# curto do commit e — quando for tag — o nome da tag. A VPS sempre roda a
# tag imutável do sha (rollback = voltar para o sha anterior).
#
# Configuração (secrets/variables do repositório e do environment
# "production"): veja docs/OPERACAO.md.
# ─────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Rodar scripts/migrate.sh up antes do deploy"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Nunca dois deploys ao mesmo tempo — e nunca cancelar um no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_URL: ${{ vars.APP_URL || 'https://dinheiro360.systemmn.site' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'dinheiro360' }}

jobs:
  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.vars.outputs.image }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Calcular nome da imagem e versão
        id: vars
        run: |
          short_sha="${GITHUB_SHA::7}"
          # ghcr.io exige nome em minúsculas.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_REF_NAME//\//-}-${short_sha}"
          fi
          {
            echo "short_sha=${short_sha}"
            echo "image=${image}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Metadados da imagem (tags + labels OCI)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.short_sha }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Gestor Financeiro 360
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.vars.outputs.version }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Migrations do banco
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Garantir psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Status antes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: scripts/migrate.sh status

      - name: Aplicar pendentes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: scripts/migrate.sh up

  deploy:
    name: Deploy no Swarm
    needs: [build, migrate]
    # Roda quando o build passou e as migrations passaram OU foram puladas.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL || 'https://dinheiro360.systemmn.site' }}
    steps:
      - uses: actions/checkout@v7

      - name: Enviar stack.yml para a VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: stack.yml
          target: ${{ secrets.VPS_STACK_DIR }}
          overwrite: true

      - name: docker stack deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.short_sha }}
          DEPLOY_VERSION: ${{ needs.build.outputs.version }}
          DEPLOY_SHA: ${{ github.sha }}
          STACK_DIR: ${{ secrets.VPS_STACK_DIR }}
          # Token para a VPS puxar a imagem do ghcr.io. O GITHUB_TOKEN expira
          # ao fim do job; para pulls futuros (reagendamento de task), use um
          # PAT com read:packages em GHCR_PULL_TOKEN — ou deixe o pacote público.
          GHCR_USER: ${{ vars.GHCR_PULL_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: DEPLOY_IMAGE,DEPLOY_VERSION,DEPLOY_SHA,STACK_DIR,STACK_NAME,GHCR_USER,GHCR_TOKEN
          # POSIX sh (o shell remoto pode ser dash): sem pipefail/bashismos.
          script: |
            set -eu
            cd "$STACK_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Segredos do app ficam no .env da VPS (nunca no repositório).
            if [ -f .env ]; then set -a; . ./.env; set +a; fi
            echo "Deploy de $DEPLOY_IMAGE ($DEPLOY_VERSION) na stack $STACK_NAME"
            # Definidas por último para o .env não sobrescrever a versão do deploy.
            IMAGE="$DEPLOY_IMAGE" APP_VERSION="$DEPLOY_VERSION" GIT_SHA="$DEPLOY_SHA" \
              docker stack deploy -c stack.yml "$STACK_NAME" --with-registry-auth
            docker service ls --filter "name=${STACK_NAME}_"

      - name: Aguardar /api/health com o commit novo
        run: |
          url="${APP_URL}/api/health"
          echo "Aguardando ${url} responder ok com commit ${GITHUB_SHA}…"
          for attempt in $(seq 1 30); do
            # Sem -f: um 503 ("degraded") também traz o JSON com o motivo.
            body="$(curl -sS --max-time 10 "$url" || true)"
            status="$(jq -r '.status // empty' <<<"$body" 2>/dev/null || true)"
            commit="$(jq -r '.commit // empty' <<<"$body" 2>/dev/null || true)"
            echo "tentativa ${attempt}: status=${status:-?} commit=${commit:-?}"
            if [[ "$status" == "ok" && "$commit" == "$GITHUB_SHA" ]]; then
              echo "✓ Deploy saudável."
              jq . <<<"$body"
              exit 0
            fi
            sleep 10
          done
          echo "::error::A versão nova não ficou saudável em 5 minutos. O Swarm faz rollback automático (failure_action: rollback); confira com 'docker service ps ${STACK_NAME}_app'."
          exit 1
