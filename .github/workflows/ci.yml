# ─────────────────────────────────────────────────────────────
# CI — roda em todo push e em todo pull request.
#
#   check   → npm ci, typecheck, testes (se houver) e build do Next
#   scripts → bash -n + shellcheck nos scripts de operação
#   docker  → build da imagem de produção (sem push), com cache do GHA
#
# Nenhum segredo é necessário: o build usa valores fictícios para as
# NEXT_PUBLIC_* (o bundle gerado aqui nunca vai para produção).
# Runbook: docs/OPERACAO.md
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Um push novo na mesma branch/PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

jobs:
  check:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm run test --if-present

      - name: Build
        run: npm run build

  scripts:
    name: Lint dos scripts shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Sintaxe (bash -n)
        run: bash -n scripts/migrate.sh

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

  docker:
    name: Build da imagem Docker
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: gestor360:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            GIT_SHA=${{ github.sha }}
            APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
